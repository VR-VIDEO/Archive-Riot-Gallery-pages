<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Gallery Pages</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0f0f10; color: #f3f3f4; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin: 0 0 8px; }
    p { color: #b5b5ba; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
    .card { background: #17181b; border: 1px solid #2e3036; border-radius: 16px; padding: 18px; }
    .meta { font-size: 12px; color: #8f929c; margin: 10px 0 14px; }
    a { display: inline-block; margin-right: 12px; color: #78e5b0; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Dynamic Gallery Pages</h1>
    <p>Static export for VRChat gallery URLs.</p>
    <section class="grid">
      
            <article class="card">
                <h2>Event TEST</h2>
                <p>test</p>
                <div class="meta">eventtest · 1 images</div>
                <a href="./eventtest/index.html">Open Gallery</a>
                <a href="https://vr-video.github.io/Archive-Riot-Gallery-pages/eventtest/urldata.json/urldata.json">urldata.json</a>
            </article>
            
    </section>
  </main>
</body>
</html>
